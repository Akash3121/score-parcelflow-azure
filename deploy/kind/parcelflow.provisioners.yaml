- uri: template://parcelflow-kind/postgres
  type: postgres
  class: default
  description: Provisions a pinned PostgreSQL database in Kind.
  state: |
    service: postgres-{{ .Id | replace "." "-" | lower }}
    database: parcelflow
    username: parcelflow
    password: {{ printf "parcelflow-kind-postgres-%s" .Id | sha256sum | trunc 24 | quote }}
  outputs: |
    host: {{ .State.service | quote }}
    port: 5432
    name: {{ .State.database | quote }}
    database: {{ .State.database | quote }}
    username: {{ .State.username | quote }}
    password: {{ encodeSecretRef (printf "%s-credentials" .State.service) "password" }}
  manifests: |
    - apiVersion: v1
      kind: Secret
      metadata:
        name: {{ .State.service }}-credentials
        {{ if ne .Namespace "" }}
        namespace: {{ .Namespace }}
        {{ end }}
        labels:
          app.kubernetes.io/managed-by: score-k8s
          app.kubernetes.io/name: postgres
          app.kubernetes.io/instance: {{ .State.service }}
        annotations:
          k8s.score.dev/source-workload: {{ .SourceWorkload }}
          k8s.score.dev/resource-uid: {{ .Uid }}
          k8s.score.dev/resource-guid: {{ .Guid }}
      stringData:
        password: {{ .State.password | quote }}
    - apiVersion: v1
      kind: Service
      metadata:
        name: {{ .State.service }}
        {{ if ne .Namespace "" }}
        namespace: {{ .Namespace }}
        {{ end }}
        labels:
          app.kubernetes.io/managed-by: score-k8s
          app.kubernetes.io/name: postgres
          app.kubernetes.io/instance: {{ .State.service }}
        annotations:
          k8s.score.dev/source-workload: {{ .SourceWorkload }}
          k8s.score.dev/resource-uid: {{ .Uid }}
          k8s.score.dev/resource-guid: {{ .Guid }}
      spec:
        type: ClusterIP
        selector:
          app.kubernetes.io/instance: {{ .State.service }}
        ports:
          - name: postgres
            port: 5432
            targetPort: postgres
    - apiVersion: apps/v1
      kind: StatefulSet
      metadata:
        name: {{ .State.service }}
        {{ if ne .Namespace "" }}
        namespace: {{ .Namespace }}
        {{ end }}
        labels:
          app.kubernetes.io/managed-by: score-k8s
          app.kubernetes.io/name: postgres
          app.kubernetes.io/instance: {{ .State.service }}
        annotations:
          k8s.score.dev/source-workload: {{ .SourceWorkload }}
          k8s.score.dev/resource-uid: {{ .Uid }}
          k8s.score.dev/resource-guid: {{ .Guid }}
      spec:
        replicas: 1
        serviceName: {{ .State.service }}
        selector:
          matchLabels:
            app.kubernetes.io/instance: {{ .State.service }}
        template:
          metadata:
            labels:
              app.kubernetes.io/managed-by: score-k8s
              app.kubernetes.io/name: postgres
              app.kubernetes.io/instance: {{ .State.service }}
          spec:
            automountServiceAccountToken: false
            securityContext:
              runAsNonRoot: true
              runAsUser: 70
              runAsGroup: 70
              fsGroup: 70
              seccompProfile:
                type: RuntimeDefault
            containers:
              - name: postgres
                image: postgres:17.6-alpine3.22
                imagePullPolicy: IfNotPresent
                env:
                  - name: POSTGRES_DB
                    value: {{ .State.database | quote }}
                  - name: POSTGRES_USER
                    value: {{ .State.username | quote }}
                  - name: POSTGRES_PASSWORD
                    valueFrom:
                      secretKeyRef:
                        name: {{ .State.service }}-credentials
                        key: password
                  - name: PGDATA
                    value: /var/lib/postgresql/data/pgdata
                ports:
                  - name: postgres
                    containerPort: 5432
                readinessProbe:
                  exec:
                    command: ["pg_isready", "-U", {{ .State.username | quote }}, "-d", {{ .State.database | quote }}]
                  initialDelaySeconds: 3
                  periodSeconds: 3
                  timeoutSeconds: 3
                  failureThreshold: 20
                livenessProbe:
                  exec:
                    command: ["pg_isready", "-U", {{ .State.username | quote }}, "-d", {{ .State.database | quote }}]
                  initialDelaySeconds: 15
                  periodSeconds: 10
                  timeoutSeconds: 3
                  failureThreshold: 6
                resources:
                  requests:
                    cpu: 100m
                    memory: 128Mi
                  limits:
                    cpu: 750m
                    memory: 512Mi
                securityContext:
                  allowPrivilegeEscalation: false
                  privileged: false
                  capabilities:
                    drop: ["ALL"]
                volumeMounts:
                  - name: data
                    mountPath: /var/lib/postgresql/data
                  - name: tmp
                    mountPath: /tmp
            volumes:
              - name: tmp
                emptyDir: {}
        volumeClaimTemplates:
          - metadata:
              name: data
              labels:
                app.kubernetes.io/managed-by: score-k8s
                app.kubernetes.io/name: postgres
                app.kubernetes.io/instance: {{ .State.service }}
            spec:
              accessModes: ["ReadWriteOnce"]
              resources:
                requests:
                  storage: 1Gi
  expected_outputs:
    - host
    - port
    - name
    - database
    - username
    - password

- uri: template://parcelflow-kind/message-queue
  type: message-queue
  class: default
  description: Provisions a pinned RabbitMQ broker and durable command queue in Kind.
  state: |
    service: rabbitmq-{{ .Id | replace "." "-" | lower }}
    queue: {{ .Id | replace "." "-" | lower | quote }}
    username: parcelflow
    password: {{ printf "parcelflow-kind-rabbitmq-%s" .Id | sha256sum | trunc 24 | quote }}
  outputs: |
    provider: rabbitmq
    endpoint: {{ printf "amqp://%s:5672" .State.service | quote }}
    queue: {{ .State.queue | quote }}
    credentialMode: password
    username: {{ encodeSecretRef (printf "%s-credentials" .State.service) "username" }}
    password: {{ encodeSecretRef (printf "%s-credentials" .State.service) "password" }}
  manifests: |
    - apiVersion: v1
      kind: Secret
      metadata:
        name: {{ .State.service }}-credentials
        {{ if ne .Namespace "" }}
        namespace: {{ .Namespace }}
        {{ end }}
        labels:
          app.kubernetes.io/managed-by: score-k8s
          app.kubernetes.io/name: rabbitmq
          app.kubernetes.io/instance: {{ .State.service }}
        annotations:
          k8s.score.dev/source-workload: {{ .SourceWorkload }}
          k8s.score.dev/resource-uid: {{ .Uid }}
          k8s.score.dev/resource-guid: {{ .Guid }}
      stringData:
        username: {{ .State.username | quote }}
        password: {{ .State.password | quote }}
        vhost: "/"
    - apiVersion: v1
      kind: Service
      metadata:
        name: {{ .State.service }}
        {{ if ne .Namespace "" }}
        namespace: {{ .Namespace }}
        {{ end }}
        labels:
          app.kubernetes.io/managed-by: score-k8s
          app.kubernetes.io/name: rabbitmq
          app.kubernetes.io/instance: {{ .State.service }}
        annotations:
          k8s.score.dev/source-workload: {{ .SourceWorkload }}
          k8s.score.dev/resource-uid: {{ .Uid }}
          k8s.score.dev/resource-guid: {{ .Guid }}
      spec:
        type: ClusterIP
        selector:
          app.kubernetes.io/instance: {{ .State.service }}
        ports:
          - name: amqp
            port: 5672
            targetPort: amqp
          - name: management
            port: 15672
            targetPort: management
    - apiVersion: apps/v1
      kind: StatefulSet
      metadata:
        name: {{ .State.service }}
        {{ if ne .Namespace "" }}
        namespace: {{ .Namespace }}
        {{ end }}
        labels:
          app.kubernetes.io/managed-by: score-k8s
          app.kubernetes.io/name: rabbitmq
          app.kubernetes.io/instance: {{ .State.service }}
        annotations:
          k8s.score.dev/source-workload: {{ .SourceWorkload }}
          k8s.score.dev/resource-uid: {{ .Uid }}
          k8s.score.dev/resource-guid: {{ .Guid }}
      spec:
        replicas: 1
        serviceName: {{ .State.service }}
        selector:
          matchLabels:
            app.kubernetes.io/instance: {{ .State.service }}
        template:
          metadata:
            labels:
              app.kubernetes.io/managed-by: score-k8s
              app.kubernetes.io/name: rabbitmq
              app.kubernetes.io/instance: {{ .State.service }}
          spec:
            automountServiceAccountToken: false
            securityContext:
              runAsNonRoot: true
              runAsUser: 999
              runAsGroup: 999
              fsGroup: 999
              seccompProfile:
                type: RuntimeDefault
            containers:
              - name: rabbitmq
                image: rabbitmq:4.1.3-management-alpine
                imagePullPolicy: IfNotPresent
                env:
                  - name: RABBITMQ_DEFAULT_USER
                    valueFrom:
                      secretKeyRef:
                        name: {{ .State.service }}-credentials
                        key: username
                  - name: RABBITMQ_DEFAULT_PASS
                    valueFrom:
                      secretKeyRef:
                        name: {{ .State.service }}-credentials
                        key: password
                  - name: RABBITMQ_DEFAULT_VHOST
                    valueFrom:
                      secretKeyRef:
                        name: {{ .State.service }}-credentials
                        key: vhost
                ports:
                  - name: amqp
                    containerPort: 5672
                  - name: management
                    containerPort: 15672
                readinessProbe:
                  exec:
                    command: ["rabbitmq-diagnostics", "-q", "check_port_connectivity"]
                  initialDelaySeconds: 20
                  periodSeconds: 5
                  timeoutSeconds: 5
                  failureThreshold: 12
                livenessProbe:
                  exec:
                    command: ["rabbitmq-diagnostics", "-q", "ping"]
                  initialDelaySeconds: 30
                  periodSeconds: 10
                  timeoutSeconds: 5
                  failureThreshold: 6
                resources:
                  requests:
                    cpu: 100m
                    memory: 256Mi
                  limits:
                    cpu: 750m
                    memory: 768Mi
                securityContext:
                  allowPrivilegeEscalation: false
                  privileged: false
                  capabilities:
                    drop: ["ALL"]
                volumeMounts:
                  - name: data
                    mountPath: /var/lib/rabbitmq
                  - name: tmp
                    mountPath: /tmp
            volumes:
              - name: tmp
                emptyDir: {}
        volumeClaimTemplates:
          - metadata:
              name: data
              labels:
                app.kubernetes.io/managed-by: score-k8s
                app.kubernetes.io/name: rabbitmq
                app.kubernetes.io/instance: {{ .State.service }}
            spec:
              accessModes: ["ReadWriteOnce"]
              resources:
                requests:
                  storage: 1Gi
  expected_outputs:
    - provider
    - endpoint
    - queue
    - credentialMode
    - username
    - password

- uri: template://parcelflow-kind/object-store
  type: object-store
  class: default
  description: Provisions a pinned Azurite Blob service in Kind.
  state: |
    service: azurite-{{ .Id | replace "." "-" | lower }}
    container: proofs
    accountName: parcelflowlocal
    accountKey: {{ printf "parcelflow-kind-azurite-%s" .Id | sha256sum | b64enc | quote }}
  outputs: |
    provider: azurite
    endpoint: {{ printf "http://%s:10000/%s" .State.service .State.accountName | quote }}
    container: {{ .State.container | quote }}
    credentialMode: shared-key
    accountName: {{ encodeSecretRef (printf "%s-credentials" .State.service) "accountName" }}
    accountKey: {{ encodeSecretRef (printf "%s-credentials" .State.service) "accountKey" }}
  manifests: |
    - apiVersion: v1
      kind: Secret
      metadata:
        name: {{ .State.service }}-credentials
        {{ if ne .Namespace "" }}
        namespace: {{ .Namespace }}
        {{ end }}
        labels:
          app.kubernetes.io/managed-by: score-k8s
          app.kubernetes.io/name: azurite
          app.kubernetes.io/instance: {{ .State.service }}
        annotations:
          k8s.score.dev/source-workload: {{ .SourceWorkload }}
          k8s.score.dev/resource-uid: {{ .Uid }}
          k8s.score.dev/resource-guid: {{ .Guid }}
      stringData:
        accountName: {{ .State.accountName | quote }}
        accountKey: {{ .State.accountKey | quote }}
        accounts: {{ printf "%s:%s" .State.accountName .State.accountKey | quote }}
    - apiVersion: v1
      kind: Service
      metadata:
        name: {{ .State.service }}
        {{ if ne .Namespace "" }}
        namespace: {{ .Namespace }}
        {{ end }}
        labels:
          app.kubernetes.io/managed-by: score-k8s
          app.kubernetes.io/name: azurite
          app.kubernetes.io/instance: {{ .State.service }}
        annotations:
          k8s.score.dev/source-workload: {{ .SourceWorkload }}
          k8s.score.dev/resource-uid: {{ .Uid }}
          k8s.score.dev/resource-guid: {{ .Guid }}
      spec:
        type: ClusterIP
        selector:
          app.kubernetes.io/instance: {{ .State.service }}
        ports:
          - name: blob
            port: 10000
            targetPort: blob
    - apiVersion: apps/v1
      kind: StatefulSet
      metadata:
        name: {{ .State.service }}
        {{ if ne .Namespace "" }}
        namespace: {{ .Namespace }}
        {{ end }}
        labels:
          app.kubernetes.io/managed-by: score-k8s
          app.kubernetes.io/name: azurite
          app.kubernetes.io/instance: {{ .State.service }}
        annotations:
          k8s.score.dev/source-workload: {{ .SourceWorkload }}
          k8s.score.dev/resource-uid: {{ .Uid }}
          k8s.score.dev/resource-guid: {{ .Guid }}
      spec:
        replicas: 1
        serviceName: {{ .State.service }}
        selector:
          matchLabels:
            app.kubernetes.io/instance: {{ .State.service }}
        template:
          metadata:
            labels:
              app.kubernetes.io/managed-by: score-k8s
              app.kubernetes.io/name: azurite
              app.kubernetes.io/instance: {{ .State.service }}
          spec:
            automountServiceAccountToken: false
            securityContext:
              runAsNonRoot: true
              runAsUser: 1000
              runAsGroup: 1000
              fsGroup: 1000
              seccompProfile:
                type: RuntimeDefault
            containers:
              - name: azurite
                image: mcr.microsoft.com/azure-storage/azurite:3.35.0
                imagePullPolicy: IfNotPresent
                command: ["azurite-blob"]
                args: ["--blobHost", "0.0.0.0", "--location", "/data", "--loose"]
                env:
                  - name: AZURITE_ACCOUNTS
                    valueFrom:
                      secretKeyRef:
                        name: {{ .State.service }}-credentials
                        key: accounts
                ports:
                  - name: blob
                    containerPort: 10000
                readinessProbe:
                  tcpSocket:
                    port: blob
                  initialDelaySeconds: 3
                  periodSeconds: 3
                  timeoutSeconds: 2
                  failureThreshold: 20
                livenessProbe:
                  tcpSocket:
                    port: blob
                  initialDelaySeconds: 10
                  periodSeconds: 10
                  timeoutSeconds: 2
                  failureThreshold: 6
                resources:
                  requests:
                    cpu: 50m
                    memory: 128Mi
                  limits:
                    cpu: 500m
                    memory: 512Mi
                securityContext:
                  allowPrivilegeEscalation: false
                  privileged: false
                  readOnlyRootFilesystem: true
                  capabilities:
                    drop: ["ALL"]
                volumeMounts:
                  - name: data
                    mountPath: /data
                  - name: tmp
                    mountPath: /tmp
            volumes:
              - name: tmp
                emptyDir: {}
        volumeClaimTemplates:
          - metadata:
              name: data
              labels:
                app.kubernetes.io/managed-by: score-k8s
                app.kubernetes.io/name: azurite
                app.kubernetes.io/instance: {{ .State.service }}
            spec:
              accessModes: ["ReadWriteOnce"]
              resources:
                requests:
                  storage: 1Gi
  expected_outputs:
    - provider
    - endpoint
    - container
    - credentialMode
    - accountName
    - accountKey
